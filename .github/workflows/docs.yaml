name: Generate and publish documentation
on:
  push:
    branches: [ docs ]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install luadox
      run: pipx install  --force git+https://github.com/jtackaberry/luadox.git

    - name: Generate API documentation
      run: doc/gen-api-docs.sh

    - name: Keep the test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docs
        path: |
          doc/api
